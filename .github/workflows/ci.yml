name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same PR/branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API build (Maven, JDK 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gamma-shop-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # pom.xml uses maven-toolchains-plugin and requires a JDK 21 toolchain entry.
      - name: Write Maven toolchains.xml
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/toolchains.xml <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <toolchains>
            <toolchain>
              <type>jdk</type>
              <provides><version>21</version></provides>
              <configuration><jdkHome>${JAVA_HOME}</jdkHome></configuration>
            </toolchain>
          </toolchains>
          EOF

      - name: Build & test
        run: mvn -B -ntp verify

  ui:
    name: UI lint, typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gamma-shop-ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: gamma-shop-ui/package-lock.json

      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck & build
        run: npm run build
